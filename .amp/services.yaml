services:
  web:
    command: '.agents/resume && docker compose up --no-build --abort-on-container-exit'
    port: 9000
    health: /
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.orb.yml
    portal:
      title: CFB Marble Game
      description: Docker nginx/PHP-FPM preview with local SQLite data refreshed once on first orb activation. Requires CFBD_API_KEY in Amp secrets.
