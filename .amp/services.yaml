services:
  web:
    command: '.agents/resume && docker compose up --no-build --abort-on-container-exit'
    port: 9000
    health: /
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.orb.yml
    portal:
      title: CFB Marble Game
      description: Docker nginx/PHP-FPM preview with a local SQLite database. No live data refresh runs automatically.
