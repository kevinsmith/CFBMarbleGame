<svg width="680" height="696" viewBox="0 0 680 696" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Modular monolith dependency structure</title>
<desc>Strata diagram: Bootstrap bar on top as the only entry from the outside world, modules including an opened Orders module in the middle, Kernel bar below where every in-app chain ends, and a vendor and PHP bar at the bottom available to everything above it, with Domain restricted to value types and pure functions, no IO or randomness. Forbidden dependencies drawn as red struck edges. A legend defines the arrow types.</desc>
<style>
text { font-family: "Helvetica Neue", Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
.box { fill: #FBFAF7; stroke: #B4B2A9; }
.c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray .th { fill: #444441; }
.c-gray .ts { fill: #5F5E5A; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple .th { fill: #3C3489; }
.c-coral rect { fill: #FAECE7; stroke: #993C1D; }
.c-coral .th { fill: #712B13; }
.c-coral .ts { fill: #993C1D; }
.c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal .th { fill: #085041; }
.c-teal .ts { fill: #0F6E56; }
.forbid { stroke: #E24B4A; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-red-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M8 1L2 5L8 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="696" fill="#FFFFFF"/>

<g class="c-gray">
  <rect x="40" y="40" width="600" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="56" text-anchor="middle" dominant-baseline="central">Bootstrap</text>
  <text class="ts" x="340" y="74" text-anchor="middle" dominant-baseline="central">the only entry from the outside world</text>
</g>

<line x1="102" y1="88" x2="102" y2="136" class="arr" marker-end="url(#arrow)"/>
<line x1="214" y1="88" x2="214" y2="136" class="arr" marker-end="url(#arrow)"/>
<line x1="432" y1="88" x2="432" y2="136" class="arr" marker-end="url(#arrow)"/>
<line x1="52" y1="88" x2="52" y2="474" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

<line x1="560" y1="136" x2="560" y2="92" class="forbid" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
<line x1="553" y1="107" x2="567" y2="121" class="forbid"/>
<line x1="567" y1="107" x2="553" y2="121" class="forbid"/>

<g class="c-purple">
  <rect x="62" y="140" width="80" height="48" rx="8" stroke-width="0.5"/>
  <text class="th" x="102" y="164" text-anchor="middle" dominant-baseline="central">Billing</text>
</g>
<g class="c-purple">
  <rect x="174" y="140" width="80" height="48" rx="8" stroke-width="0.5"/>
  <text class="th" x="214" y="164" text-anchor="middle" dominant-baseline="central">Tax</text>
</g>
<line x1="146" y1="164" x2="170" y2="164" class="forbid" stroke-dasharray="4 3" marker-start="url(#arrow-red-rev)" marker-end="url(#arrow-red)"/>
<line x1="152" y1="158" x2="164" y2="170" class="forbid"/>
<line x1="164" y1="158" x2="152" y2="170" class="forbid"/>

<rect class="box" x="262" y="140" width="340" height="320" rx="12" stroke-width="0.5"/>
<text class="th" x="432" y="158" text-anchor="middle" dominant-baseline="central">Orders — one module, opened</text>

<g class="c-coral">
  <rect x="282" y="174" width="132" height="48" rx="8" stroke-width="0.5"/>
  <text class="th" x="348" y="192" text-anchor="middle" dominant-baseline="central">Presentation</text>
  <text class="ts" x="348" y="210" text-anchor="middle" dominant-baseline="central">driving adapter</text>
</g>
<g class="c-coral">
  <rect x="450" y="174" width="132" height="48" rx="8" stroke-width="0.5"/>
  <text class="th" x="516" y="192" text-anchor="middle" dominant-baseline="central">Infrastructure</text>
  <text class="ts" x="516" y="210" text-anchor="middle" dominant-baseline="central">driven adapter</text>
</g>
<line x1="418" y1="198" x2="446" y2="198" class="forbid" stroke-dasharray="4 3" marker-start="url(#arrow-red-rev)" marker-end="url(#arrow-red)"/>
<line x1="426" y1="192" x2="438" y2="204" class="forbid"/>
<line x1="438" y1="192" x2="426" y2="204" class="forbid"/>

<g class="c-purple">
  <rect x="332" y="252" width="200" height="38" rx="8" stroke-width="0.5"/>
  <text class="th" x="432" y="271" text-anchor="middle" dominant-baseline="central">Application</text>
</g>
<g class="c-teal">
  <rect x="332" y="318" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="432" y="332" text-anchor="middle" dominant-baseline="central">Domain</text>
  <text class="ts" x="432" y="350" text-anchor="middle" dominant-baseline="central">no in-module dependencies</text>
</g>

<line x1="348" y1="226" x2="398" y2="248" class="arr" marker-end="url(#arrow)"/>
<line x1="516" y1="226" x2="466" y2="248" class="arr" marker-end="url(#arrow)"/>
<line x1="432" y1="294" x2="432" y2="314" class="arr" marker-end="url(#arrow)"/>
<path d="M304 226 V340 H326" class="arr" marker-end="url(#arrow)"/>
<path d="M560 226 V340 H538" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="432" y="380" text-anchor="middle">driving: wire formats enter here, via Bootstrap</text>
<text class="ts" x="432" y="396" text-anchor="middle">driven: fulfills interfaces defined beneath it</text>
<text class="ts" x="432" y="412" text-anchor="middle">only Bootstrap references Infrastructure</text>
<text class="ts" x="432" y="428" text-anchor="middle">(and wires all four layers)</text>
<text class="ts" x="432" y="444" text-anchor="middle">all layers may reference Kernel, vendor &amp; PHP library</text>

<line x1="102" y1="192" x2="102" y2="474" class="arr" marker-end="url(#arrow)"/>
<line x1="214" y1="192" x2="214" y2="474" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="40" y="478" width="600" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="494" text-anchor="middle" dominant-baseline="central">Kernel</text>
  <text class="ts" x="340" y="510" text-anchor="middle" dominant-baseline="central">available to everything above</text>
  <text class="ts" x="340" y="526" text-anchor="middle" dominant-baseline="central">depends on nothing in the app — every in-app chain ends here</text>
</g>

<line x1="340" y1="538" x2="340" y2="554" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="558" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="574" text-anchor="middle" dominant-baseline="central">vendor &amp; PHP library</text>
<text class="ts" x="340" y="590" text-anchor="middle" dominant-baseline="central">the ground beneath the app — available to everything above</text>
<text class="ts" x="340" y="606" text-anchor="middle" dominant-baseline="central">Domain may depend on value types and pure functions only, no IO or randomness</text>

<line x1="95" y1="636" x2="131" y2="636" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="139" y="640" text-anchor="start">depends on</text>
<line x1="300" y1="636" x2="336" y2="636" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<text class="ts" x="344" y="640" text-anchor="start">may skip levels (Bootstrap → Kernel)</text>

<line x1="95" y1="660" x2="131" y2="660" class="forbid" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
<line x1="107" y1="654" x2="119" y2="666" class="forbid"/>
<line x1="119" y1="654" x2="107" y2="666" class="forbid"/>
<text class="ts" x="139" y="664" text-anchor="start">forbidden — may not depend (heads show the banned direction)</text>

<text class="ts" x="340" y="686" text-anchor="middle">adapters at the top, cores at the bottom — the same shape at both scales</text>
</svg>
